# GTA 6 clip farm settings. Every value here has a default in clipfarm/config.py,
# so you only need to keep the lines you change.

# Your "Let's Build X" structure, turned into "Can I do X in GTA 6?".
# Seconds per beat for the 60s challenge Short (Tier A).
template:
  hook: 3        # 01  Create a question the viewer needs answered
  problem: 5     # 02  Show why it's hard
  challenge: 4   # 03  Rules + stakes: will it work?
  build: 18      # 04  The attempt - only shots that move the story
  obstacle: 10   # 05  "That's not supposed to happen..."
  reengage: 8    # 06  "One more thing to try..."
  result: 9      # 07  The payoff
  end: 3         # 08  One-line kicker, hard cut

# Hotkeys you press WHILE PLAYING, right after the moment happens.
hotkeys:
  problem: f5     # the situation is set up / it's looking hard
  attempt: f6     # a good attempt / progress shot (press several times)
  obstacle: f7    # it went wrong
  retry: f8       # the last-ditch plan starts
  result: f9      # the payoff (success or epic fail)
  moment: f10     # any clip-worthy moment (becomes a short "moment clip")
  undo: f11       # delete the last tag
  record: f12     # only used without OBS websocket: press together with your OBS record key

# Seconds of footage kept AFTER each hotkey press (you press just after it happens).
post_roll: 1.5

obs:
  use_websocket: true   # OBS -> Tools -> WebSocket Server Settings -> Enable
  host: localhost
  port: 4455
  password: ""

video:
  width: 1080
  height: 1920
  fps: 30
  mode: blur        # blur = gameplay over a blurred copy of itself | crop = full-height center crop
  fg_aspect: 1.25   # blur mode: trim the sides of 16:9 gameplay to this aspect so it's bigger on a phone
  crop_x: 0.5       # crop mode: horizontal focus, 0 = left edge, 1 = right edge
  crf: 20
  preset: veryfast
  punch_in: true    # quick zoom punch at the start of the obstacle and result beats
  encoder: h264_amf # h264_amf = your AMD card's encoder (fast) | libx264 = CPU. Falls back to CPU automatically
  facecam_height: 0.38  # streamer split layout: share of the screen the face cam gets

text:
  font: Arial Black
  beat_size: 84     # the big on-screen beat lines (hook, stakes, "that's not supposed to happen")
  caption_size: 70  # spoken-word captions

captions:
  enabled: true
  # whisper-cpp runs on AMD GPUs (RX 580) through Vulkan; faster-whisper runs on the CPU there.
  # whisper.cpp setup: see README "Captions on an AMD GPU". Leave as faster-whisper until then.
  engine: faster-whisper
  model: small      # faster-whisper model: tiny | base | small | medium (bigger = better, slower)
  whisper_cpp_exe: ""     # e.g. C:/tools/whisper/whisper-cli.exe
  whisper_cpp_model: ""   # e.g. C:/tools/whisper/ggml-small.en.bin
  words_per_line: 3

audio:
  game_volume: 1.0        # when there is no voiceover
  game_volume_under_vo: 0.3

# Short "moment clips" (Tier B), cut from tags + automatic loudness spikes.
moments:
  length: 18        # seconds of build-up + payoff
  hook_flash: 1.5   # open on this many seconds of the payoff, then rewind to the build-up
  max: 10           # most clips per recording
  min_gap: 20       # seconds between two clips
  auto: true        # also find loud moments you didn't tag

# Writes hooks, titles and descriptions. "none" uses built-in templates (free, offline).
# "lmstudio": free local AI that runs on AMD cards (RX 580). Install https://lmstudio.ai, download
#   an 8B instruct model (e.g. Llama 3.1 8B Instruct Q4), start its local server, then set:
#     provider: lmstudio / model: <the model name LM Studio shows> / url: http://localhost:1234
# "ollama": free local AI for newer GPUs (https://ollama.com), url http://localhost:11434
llm:
  provider: none
  model: llama3.1
  url: http://localhost:11434

# Format testing. Every clip gets a format and hook style; the tracker learns which win.
#   formats:     payoff_first (flash the payoff, then rewind) | straight (plain, the control)
#                beat_story (question hook -> build -> "Wait for it..." -> payoff -> hard cut)
#                loop (~9s, ends on the payoff so it loops) | countdown (top 3 of a stream)
#                multi_react (several streamers, same moment - made from a plan, see README)
#   hook_styles: viewer_title (a Twitch viewer's clip title) | question | curiosity | ai (needs llm)
# Until every option has min_scored scored clips, they rotate evenly. After that, winners get
# more clips, but `explore` (20%) of picks stay random so the test keeps learning.
experiments:
  enabled: true
  formats: [payoff_first, straight, beat_story, loop, countdown, multi_react]
  hook_styles: [viewer_title, question, curiosity, ai]
  min_scored: 15
  explore: 0.2
  score_hours: 48   # a post is scored on its views this many hours after posting

# Auto-posting of clips you APPROVED on the review page.
publish:
  platforms: [youtube, instagram, facebook, tiktok, x]
  min_gap_minutes: 90       # per platform: space posts out instead of dumping them at once
  hours: [9, 23]            # only post between these local hours
  meta_api_version: v23.0   # Meta Graph API version; bump when Meta retires it
  youtube:
    daily_max: 5            # the API's free daily quota allows only a handful of uploads
    privacy: public         # forced to private by YouTube until your API project passes its audit
  instagram:
    daily_max: 10
  facebook:
    daily_max: 10           # Meta's hard limit is 30 API Reels per Page per 24h
  tiktok:
    # inbox:  the clip lands in your TikTok app as a draft; tap the notification, paste the
    #         caption (copy button on the review page), post. Works without TikTok's audit.
    # direct: posts straight to your profile. Only public after TikTok audits your app -
    #         before that it can only post privately, and only to a private account.
    mode: inbox
    daily_max: 5            # TikTok allows at most 5 pending inbox drafts per 24h
    privacy: PUBLIC_TO_EVERYONE   # direct mode only
  x:
    daily_max: 8            # X bills each post (~$0.015 in 2026); see x.monthly_post_limit

# Outreach: permission requests to streamers YOU queue on the Discover tab (email, Twitch whispers).
# Every message offers an opt-out; nobody gets more than one follow-up.
outreach:
  your_name: ""            # how you sign messages, e.g. "Revan"
  your_channel: ""         # your clip channel, e.g. "youtube.com/@yourclips" (makes you look legit)
  daily_max: 10            # messages per 24h across all channels
  min_gap_minutes: 10
  hours: [10, 20]          # only send between these local hours
  followup: true
  followup_days: 5         # one polite follow-up if they haven't replied

# Streamer discovery (python -m clipfarm discover). Run it a few times a day at different hours.
#   viewers: the audience size most likely to say yes to a clipper (bigger streamers rarely reply)
#   languages: stream languages to include ([] = any)
discovery:
  games: ["Grand Theft Auto VI", "Grand Theft Auto V"]
  languages: ["en"]
  viewers: [100, 8000]
  youtube_queries: ["GTA 6 live", "GTA V RP live"]   # each costs 100 of YouTube's 10,000 free daily units

# YouTube streamers (platform: youtube in sources.yaml, login: their @handle). Moments come from
# the live chat replay and YouTube's "most replayed" graph. If yt-dlp says "confirm you're not a
# bot", set cookies_from_browser to the browser you're signed in to YouTube with (e.g. chrome).
youtube_live:
  use_chat: true
  use_heatmap: true
  cookies_from_browser: ""

# Kick streamers (platform: kick in sources.yaml). Works from viewer clips made in the last
# `hours`. Only clips whose category contains one of `categories` are used (set a streamer's own
# list with rules: categories: [...] in sources.yaml; [] = any). Clips in `block_categories`
# are ALWAYS skipped - promoting gambling gets clip accounts banned.
kick:
  hours: 48
  categories: ["Grand Theft Auto"]
  block_categories: ["Slots", "Casino", "Gambling", "Betting"]

# TikTok stats sign-in. Register http://localhost:<port>/callback/ as a redirect URI in your app.
tiktok:
  port: 8899

# X stats. X charges per post read (~$0.005 in 2026), so each post is read only at these
# checkpoints (hours after posting), and never more than monthly_read_limit reads a month.
x:
  checkpoints: [48, 168]
  monthly_read_limit: 1000   # ~ $5 at 2026 prices
  monthly_post_limit: 150    # ~ $2.25 - links are stripped from X captions (they cost ~13x more)
  port: 8898                 # sign-in callback: register http://127.0.0.1:8898/callback in your X app

hashtags: ["#gta6", "#gta", "#gtavi", "#gaming", "#shorts"]
