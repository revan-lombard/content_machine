# Copy this file to secrets.yaml (which git ignores) and fill it in.
# Twitch: create a free app at https://dev.twitch.tv/console/apps
#   Name: anything | OAuth Redirect URL: http://localhost | Category: Application Integration
#   Client type: Confidential. Then copy the Client ID and click "New Secret".
twitch:
  client_id: ""
  client_secret: ""

# YouTube view counts for the performance tracker (free). In https://console.cloud.google.com:
#   create a project -> APIs & Services -> Library -> enable "YouTube Data API v3"
#   -> Credentials -> Create credentials -> API key. Paste it here.
youtube:
  api_key: ""

# ---- Auto-posting ----
# YouTube uploads (OAuth). In the same Google Cloud project as above:
#   APIs & Services -> OAuth consent screen: External, add yourself as a test user
#   -> Credentials -> Create credentials -> OAuth client ID -> Desktop app. Copy both values here,
#   then run: python -m clipfarm connect youtube
youtube_oauth:
  client_id: ""
  client_secret: ""

# Instagram + Facebook Reels. Create an app at https://developers.facebook.com/apps (type: Business),
# copy its App ID and App Secret here. Then in Graph API Explorer, pick your app, add the permissions
# listed in the README, click "Generate Access Token", and run:
#   python -m clipfarm connect meta --token <that token>
meta:
  app_id: ""
  app_secret: ""

# TikTok view counts (Display API). At https://developers.tiktok.com -> Manage apps -> Connect an app:
#   add the products "Login Kit" (platform: Desktop, redirect URI http://localhost:8899/callback/)
#   and the scopes user.info.basic + video.list. While the app is in Sandbox, add the TikTok account
#   you post with as a target user. Copy the Client key and Client secret here, then run:
#   python -m clipfarm connect tiktok
tiktok:
  client_key: ""
  client_secret: ""
